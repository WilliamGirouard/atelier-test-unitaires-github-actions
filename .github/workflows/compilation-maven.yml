name: Compilation du projet Maven
on:
    push:
        branches:
            - main
    workflow_dispatch:
#Ma definition de job qui va sexecuter sur la branche...     
jobs:
    test-and-analyze:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v5
          with:
            # nécessaire pour que l'analyse SonarCloud puisse comparer avec l'historique (New Code)
            fetch-depth: 0

        - name: Set up JDK 25
          uses: actions/setup-java@v5
          with:
            java-version: '25'
            distribution: 'temurin'
            cache: maven

        - name: Build, tests et analyse SonarCloud
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
    compilation:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: '25'
            - name: Fournir access au runner
              run: chmod +x mvnw
            - name: Compilation du projet Maven
              run: ./mvnw compile
#Ecrire les 17 tests qui echouent actuellement 
# Ajouter une etape qui execute les tests que si la compilation reussi
            - name: Build and run tests
              run: ./mvnw -B clean verify
            - name: Publier le  rapport des tests
              uses: actions/upload-artifact@v5
              with:
                name: rapport-jacoco
                path: target/site/jacoco/
            - name: Build
              run: ./mvnw -B clean package -DskipTests
            - name: Publier le .jar en artefact
              uses: actions/upload-artifact@v5
              with:
                name: application-jar
                path: target/*.jar